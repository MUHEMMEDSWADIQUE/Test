# This is a Declarative Automation Bundle definition for test_bundle.
# See https://docs.databricks.com/dev-tools/bundles/index.html for documentation.
bundle:
  name: test_bundle
  uuid: 20887373-d4c6-4a2b-92a0-d6735198a058

include:
  - resources/*.yml

# Variable declarations. These variables are assigned in the dev/prod targets below.
variables:
  catalog:
    description: The catalog to use
  schema:
    description: The schema to use

targets:
  dev:
    # The default target uses 'mode: development' to create a development copy.
    # - Deployed resources get prefixed with '[dev my_user_name]'
    # - Any job schedules and triggers are paused by default.
    # See also https://docs.databricks.com/dev-tools/bundles/deployment-modes.html.
    mode: development
    default: true
    workspace:
      host: https://dbc-48c8f217-7ee8.cloud.databricks.com
    variables:
      catalog: workspace
      schema: ${workspace.current_user.short_name}
  prod:
    mode: production
    workspace:
      host: https://dbc-48c8f217-7ee8.cloud.databricks.com
      # We explicitly deploy to /Workspace/Users/swadiqueputhukkolli@gmail.com to make sure we only have a single copy.
      root_path: /Workspace/Users/swadiqueputhukkolli@gmail.com/.bundle/${bundle.name}/${bundle.target}
    variables:
      catalog: workspace
      schema: prod
    permissions:
      - user_name: swadiqueputhukkolli@gmail.com
        level: CAN_MANAGE
